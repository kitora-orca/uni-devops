name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_DIR: lab3/code/beetles_app

jobs:
  style-check:
    name: 1. Проверка стиля
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lab3/code/beetles_app/requirements.txt
      - name: Установить Ruff
        run: python -m pip install ruff==0.17.0
      - name: Ruff и JSON-отчёт
        run: python -m ruff check --no-cache --output-format json . > ruff-report.json
      - name: Сохранить отчёт Ruff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: lab3/code/beetles_app/ruff-report.json
          if-no-files-found: warn

  security-check:
    name: 2. Проверка безопасности Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lab3/code/beetles_app/requirements.txt
      - name: Установить Bandit
        run: python -m pip install bandit==1.9.4
      - name: Проверить только исходный код (без виртуальных окружений)
        run: |
          python -m bandit -r . \
            -x ./tests,./docker_migrations,./alembic,./.venv,./venv,./env,./.tox,./site-packages \
            -ll -f json -o bandit-report.json
      - name: Сохранить отчёт Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: lab3/code/beetles_app/bandit-report.json
          if-no-files-found: warn

  secrets-check:
    name: 2a. Поиск секретов Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Поиск секретов в репозитории
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --report-format json --report-path /repo/gitleaks-report.json
      - name: Сохранить отчёт Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  dependencies-check:
    name: 2b. Проверка зависимостей
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lab3/code/beetles_app/requirements.txt
      - name: Установить pip-audit
        run: python -m pip install pip-audit
      - name: Проверить зависимости и создать отчёт
        run: python -m pip_audit -r requirements.txt --format json --output dependency-report.json
      - name: Сохранить отчёт зависимостей
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: lab3/code/beetles_app/dependency-report.json
          if-no-files-found: warn

  migrations-check:
    name: 3. Проверка миграций
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    env:
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      CI_SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить настройки
        run: |
          test -n "$CI_DB_PASSWORD" && test -n "$CI_SESSION_SECRET"
