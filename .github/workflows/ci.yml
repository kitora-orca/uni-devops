name: Beetles CI

on:
  push:
    branches:
      - main
      - lab4-ci-cd
  pull_request:
    branches:
      - main

jobs:
  first-check:
    name: First CI check
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "GitHub Actions запущен!"
          test -f lab3/code/beetles_app/main.py
          test -f lab3/code/beetles_app/requirements.txt
          echo "Основные файлы проекта найдены!"
