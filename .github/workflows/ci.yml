
name: Docker CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  APP_DIR: lab3/code/beetles_app

jobs:
  style-check:
    name: 1. Проверка стиля
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python и кэш pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lab3/code/beetles_app/requirements.txt

      - name: Установить Ruff
        run: python -m pip install ruff==0.17.0

      - name: Проверить стиль Python
        run: python -m ruff check --no-cache --output-format json --output-file ruff-report.json .

      - name: Сохранить отчёт Ruff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: lab3/code/beetles_app/ruff-report.json
          if-no-files-found: warn


  security-check:
    name: 2. Проверка безопасности
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab3/code/beetles_app

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тестовые настройки
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_ci_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env

      - name: Собрать Docker-образ
        run: docker compose build

      - name: Проверить безопасность Bandit
        run: |
          docker compose run --rm --no-deps app \
            python -m bandit -r . \
            -x ./tests,./docker_migrations,./alembic \
            -ll -f json > bandit-report.json

      - name: Сохранить отчёт Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: lab3/code/beetles_app/bandit-report.json
          if-no-files-found: warn


  secrets-check:
    name: 2a. Поиск секретов Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить историю Git
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --report-format json --report-path /repo/gitleaks-report.json
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  dependencies-check:
    name: 2b. Проверка зависимостей
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lab3/code/beetles_app/requirements.txt
      - name: Установить pip-audit
        run: python -m pip install pip-audit
      - name: Проверить зависимости
        run: python -m pip_audit -r requirements.txt --format json --output dependency-report.json
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: lab3/code/beetles_app/dependency-report.json
          if-no-files-found: warn

  migrations-check:
    name: 3. Проверка миграций
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тестовые настройки
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_ci_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env

          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_test_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env.test.docker

      - name: Запустить PostgreSQL и приложение
        run: docker compose up -d --build --wait

      - name: Создать тестовую базу
        run: |
          docker compose exec -T db psql -U postgres -d postgres \
            -c "CREATE DATABASE beetles_test_db;"

      - name: Создать исходную схему
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U postgres -d beetles_test_db < beetles_schema.sql

      - name: Применить миграции Alembic
        run: |
          docker compose cp .env.test.docker app:/app/.env.test.docker
          docker compose exec -T app python -m alembic \
            -c alembic.docker.ini upgrade head

      - name: Проверить текущую миграцию
        run: |
          docker compose exec -T app python -m alembic \
            -c alembic.docker.ini current

      - name: Остановить контейнеры
        if: always()
        run: docker compose down -v

  backup-check:
    name: 4. Резервное копирование
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тестовые настройки
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_ci_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env

      - name: Запустить PostgreSQL
        run: docker compose up -d --wait db

      - name: Создать таблицы
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U postgres -d beetles_ci_db < beetles_schema.sql

      - name: Создать резервную копию
        run: |
          docker compose exec -T db pg_dump \
            -U postgres -d beetles_ci_db -Fc > backup.dump

      - name: Проверить резервную копию
        run: |
          test -s backup.dump
          docker compose exec -T db pg_restore \
            -l < backup.dump > /dev/null
          echo "Резервная копия создана и читается"

      - name: Проверить восстановление
        run: |
          docker compose exec -T db createdb \
            -U postgres beetles_restore_check
          docker compose exec -T db pg_restore \
            -U postgres -d beetles_restore_check \
            --exit-on-error < backup.dump
          docker compose exec -T db psql \
            -U postgres -d beetles_restore_check \
            -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"

      - name: Остановить контейнеры
        if: always()
        run: docker compose down -v

  container-check:
    name: 5. Проверка контейнеров
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тестовые настройки
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_ci_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env

      - name: Запустить контейнеры
        run: docker compose up -d --build --wait

      - name: Проверить контейнеры
        run: make container-check

      - name: Остановить контейнеры
        if: always()
        run: docker compose down -v

  tests-check:
    name: 6. Python-тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тестовые настройки
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_ci_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env

          {
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=beetles_test_db"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            echo "SESSION_SECRET=ci-only-test-secret"
          } > .env.test.docker

      - name: Запустить контейнеры
        run: docker compose up -d --build --wait

      - name: Создать тестовую базу
        run: |
          docker compose exec -T db psql -U postgres -d postgres \
            -c "CREATE DATABASE beetles_test_db;"

      - name: Создать исходную схему
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 \
            -U postgres -d beetles_test_db < beetles_schema.sql

      - name: Применить миграции
        run: |
          docker compose cp .env.test.docker app:/app/.env.test.docker
          docker compose exec -T app python -m alembic \
            -c alembic.docker.ini upgrade head

      - name: Подготовить pytest
        run: docker compose cp .env.test.docker app:/app/.env.test

      - name: Запустить 30 тестов
        run: docker compose exec -T app python -m pytest -v --junitxml=/tmp/pytest-report.xml

      - name: Скопировать отчёт pytest
        if: always()
        run: |
          CONTAINER_ID=$(docker compose ps -q app)
          if [ -n "$CONTAINER_ID" ]; then
            docker cp "$CONTAINER_ID:/tmp/pytest-report.xml" pytest-report.xml || true
          fi

      - name: Сохранить отчёт pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: lab3/code/beetles_app/pytest-report.xml
          if-no-files-found: warn

      - name: Остановить контейнеры
        if: always()
        run: docker compose down -v

  build-image:
    name: 7. Сборка Docker-образа
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/code/beetles_app
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ
        run: docker build -t beetles-app:ci .

      - name: Проверить наличие образа
        run: docker image inspect beetles-app:ci

  publish-image:
    name: 8. Публикация Docker-образа
    runs-on: ubuntu-latest

    needs:
      - style-check
      - security-check
      - secrets-check
      - dependencies-check
      - migrations-check
      - backup-check
      - container-check
      - tests-check
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить имя образа
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/beetles-app" >> "$GITHUB_OUTPUT"

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: ./lab3/code/beetles_app
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
