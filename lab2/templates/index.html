<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Фирма по ловле жуков</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
    <h1>Фирма по ловле жуков</h1>
    <p>Минимальная информационная система</p>

    <button id="logout-button">
        Выйти
    </button>
</header>


<main>

    <!-- КОМАНДЫ -->

    <section>
        <h2>Команды</h2>

        <form id="team-form">
            <input
                type="text"
                id="team-name"
                placeholder="Название команды"
                required
            >

            <button type="submit">
                Добавить
            </button>
        </form>

        <div id="teams"></div>
    </section>


    <!-- МЕСТА -->

    <section>
        <h2>Места ловли</h2>

        <form id="place-form">
            <input
                type="text"
                id="place-name"
                placeholder="Название места"
                required
            >

            <button type="submit">
                Добавить
            </button>
        </form>

        <div id="places"></div>
    </section>


    <!-- ВИДЫ ЖУКОВ -->

    <section>
        <h2>Виды жуков</h2>

        <form id="species-form">
            <input
                type="text"
                id="species-name"
                placeholder="Название вида"
                required
            >

            <button type="submit">
                Добавить
            </button>
        </form>

        <div id="species"></div>
    </section>


    <!-- ЭКСПЕДИЦИЯ -->

    <section>
        <h2>Новая экспедиция</h2>

        <form id="expedition-form">

            <label>
                Команда:
            </label>

            <select id="expedition-team" required>
                <option value="">Выберите команду</option>
            </select>


            <label>
                Место:
            </label>

            <select id="expedition-place" required>
                <option value="">Выберите место</option>
            </select>


            <label>
                Начало:
            </label>

            <input
                type="datetime-local"
                id="start-time"
                required
            >


            <label>
                Окончание:
            </label>

            <input
                type="datetime-local"
                id="end-time"
                required
            >


            <button type="submit">
                Создать экспедицию
            </button>

        </form>

        <div id="expeditions"></div>
    </section>


    <!-- УЛОВ -->

    <section>
        <h2>Регистрация улова</h2>

        <form id="catch-form">

            <label>
                Экспедиция:
            </label>

            <select id="catch-expedition" required>
                <option value="">Выберите экспедицию</option>
            </select>


            <label>
                Вид жука:
            </label>

            <select id="catch-species" required>
                <option value="">Выберите вид</option>
            </select>


            <label>
                Количество:
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                required
            >


            <button type="submit">
                Добавить улов
            </button>

        </form>

        <div id="catches"></div>
    </section>

    <!-- Отчёт по улову за период -->
    <section>
      <h2>Отчёт по улову за период</h2>

      <div class="form-row">
          <label>
              С:
              <input type="date" id="report-date-from">
          </label>

          <label>
              По:
              <input type="date" id="report-date-to">
          </label>

          <button onclick="loadCatchReport()">
              Сформировать отчёт
          </button>
      </div>

      <table>
          <thead>
              <tr>
                  <th>Вид жука</th>
                  <th>Количество</th>
              </tr>
          </thead>
          <tbody id="catch-report-table">
          </tbody>
      </table>
    </section>


    <!-- ОТЧЁТ -->

    <section>

        <h2>Улов</h2>

        <button onclick="loadReport()">
            Обновить отчёт
        </button>

        <div id="report"></div>

    </section>

</main>


<script src="/static/app.js"></script>

</body>
</html>
